<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Priyan | Home</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;

    /* Background Image */
    background: url("eye.jpg") no-repeat center center/cover;
}

/* Dark overlay for better text visibility */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
    animation: fadeIn 2s ease-in-out;
}

h1 {
    font-size: 50px;
    margin-bottom: 10px;
}

p {
    font-size: 24px;
    letter-spacing: 1px;
}

button {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    background-color: #ffcc00;
    color: black;
    transition: 0.3s;
}

button:hover {
    background-color: white;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>

</head>
<body>

<div class="container">
    <h1>Hi, I am Krishna Priyan</h1>
    <p>Welcome to my website</p>
    <button onclick="alert('Thanks for visiting! 😊')">Explore More</button>
</div>

</body>
</html>
