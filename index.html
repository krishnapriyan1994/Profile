<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>krishnapriyan</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background-color: #fdfdfd;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 200px;
      min-width: 150px;
      background-color: #2c2c2c;
      color: white;
      padding: 20px;
      border-right: 1px solid #ccc;
      overflow-y: auto;
      transition: width 0.3s ease;
    }

    .sidebar h2 {
      color: white; 
      margin-bottom: 15px;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-list li {
      padding: 10px;
      border-bottom: 1px solid #444; 
      color: white;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 10px;
    }

    .task-list li:hover {
      background-color: #3a3a3a;
    }

    .task-list li.active {
      background-color: #555;
    }

    /* ===== CONTENT ===== */
    .content {
      flex-grow: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: url('eye.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    iframe {
      flex-grow: 1;
      width: 100%;
      border: none;
    }

    .welcome {
      text-align: center;
      margin: auto;
      color: white;
    }

    .container {
      text-align: center;
      margin: auto;
      color: white;
    }

    .container h2 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .container p {
      font-size: 22px;
      color: white;
    }

    .typed {
      color: white;
      font-weight: bold;
    }
	.task-list li i {
  margin-right: 10px;
}
.task-list li:hover i {
  color: #ff4d4d;
}
.profile {
  text-align: left;
  margin-bottom: 15px;
}

.profile img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #ff4d4d;
  box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
}
.sidebar {
  display: flex;
  flex-direction: column;
}

.task-list {
  flex-grow: 1;
}


.social-icons {
  text-align: center;
  margin-top: auto;
  padding-top: 15px;
}

.social-icons a {
  display: inline-block;
  margin: 0 8px;
}

.social-icons img {
  width: 22px;
  height: 22px;
  transition: 0.3s;
}

.social-icons img:hover {
  transform: translateY(-3px);
  filter: brightness(1.3);
}


  </style>
</head>

<body>

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar" id="sidebar">
  
  <div class="profile">
  <img src="DP.png" alt="Profile Photo">
</div>
    <h2>Krishnapriyan</h2>
    <ul class="task-list">
  <li onclick="loadTask(this, 'Home.html')">
    <i class="fas fa-home"></i> Home
  </li>

  <li onclick="loadTask(this, 'ADCB.html')">
    <i class="fas fa-user"></i> About Me
  </li>

  <li onclick="loadTask(this, 'email_campaign_execution.html')">
    <i class="fas fa-file-alt"></i> Resume
  </li>

  <li onclick="loadTask(this, 'SMS.html')">
    <i class="fas fa-briefcase"></i> Portfolio
  </li>

  <li onclick="loadTask(this, 'task2.html')">
    <i class="fas fa-code"></i> Projects
  </li>

  <li onclick="loadTask(this, 'asm_admin.html')">
    <i class="fas fa-envelope"></i> Contacts
  </li>
</ul>
<div class="social-icons">
  <a href="https://facebook.com/yourprofile" target="_blank">
    <img src="Fb.png" alt="Facebook">
  </a>

  <a href="https://instagram.com/yourprofile" target="_blank">
    <img src="ig.jpg" alt="Instagram">
  </a>

  <a href="https://twitter.com/yourprofile" target="_blank">
    <img src="x.png" alt="Twitter">
  </a>

  <a href="https://linkedin.com/in/yourprofile" target="_blank">
    <img src="ln.png" alt="LinkedIn">
  </a>
</div>
  </div>

  <!-- ===== CONTENT ===== -->
  <div class="content" id="mainContent">
    <div class="welcome">
      <div class="container">
	 
        <h2>Krishnapriyan</h2>
        <p>
          I'm 
          <span class="typed"
            data-typed-items="Campaign Management,Unica, Linux Tinkerer, Tech Explorer">
          </span>
        </p>
      </div>
    </div>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script>
    function loadTask(element, page) {
      document.getElementById("mainContent").innerHTML =
        `<iframe src="${page}"></iframe>`;

      let items = document.querySelectorAll(".task-list li");
      items.forEach(li => li.classList.remove("active"));
      element.classList.add("active");
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

<script>
window.addEventListener("load", function () {

  var typedElement = document.querySelector(".typed");

  if (typedElement) {

    var items = typedElement
      .getAttribute("data-typed-items")
      .split(",")
      .map(item => item.trim());

    typedElement.innerHTML = ""; // Clear text first

    setTimeout(function () {
      new Typed(".typed", {
        strings: items,
        typeSpeed: 70,
		
        backSpeed: 50,
        backDelay: 1500,
        startDelay: 300,
        loop: true
      });
    }, 300);

  }

});
</script>


</body>
</html>
